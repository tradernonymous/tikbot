version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tikbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: tikbot
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tikbot-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  sidecar-py:
    build:
      context: ./sidecars/tiktok-py
      dockerfile: Dockerfile
    container_name: tikbot-sidecar-py
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      - INTERNAL_API_SECRET=tikbot-internal-secret-change-in-prod
      - PORT=8000

volumes:
  pgdata:
  redisdata:
